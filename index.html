<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Static SEO baseline.

      Every tag flagged with `data-static-seo` is a crawler-facing fallback for
      bots that do not execute JavaScript (WhatsApp, Slack, legacy social
      scrapers). Once React mounts, `src/components/seo/Seo.tsx` removes them and
      takes over with per-route values, so the document never carries duplicate
      `<title>`, `description`, `canonical`, Open Graph or Twitter tags.
    -->
    <title data-static-seo>LORSAM | HVAC/R Climatización y Refrigeración Monterrey</title>
    <meta
      data-static-seo
      name="description"
      content="LORSAM: climatización y refrigeración industrial HVAC/R en Monterrey y Nuevo León. Sistemas VRF/TVR, chillers, cuartos fríos. +40 años, 500+ instalaciones."
    />
    <meta
      data-static-seo
      name="keywords"
      content="lorsam, climas lorsam, lorsam climas, multi servicios y climas lorsam, lorsam monterrey, climatizacion industrial monterrey, sistemas vrf monterrey, refrigeracion industrial santa catarina, mantenimiento de chillers, cuartos frios monterrey, polizas mantenimiento hvac, HVAC/R"
    />
    <meta data-static-seo name="author" content="Multi Servicios y Climas Lorsam SA de CV" />
    <meta
      data-static-seo
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta
      data-static-seo
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link data-static-seo rel="canonical" href="https://www.lorsam.com/" />

    <!-- Geo-targeting: Santa Catarina, Nuevo León, México -->
    <meta name="geo.region" content="MX-NLE" />
    <meta name="geo.placename" content="Santa Catarina, Monterrey, Nuevo León" />
    <meta name="geo.position" content="25.6766;-100.4633" />
    <meta name="ICBM" content="25.6766, -100.4633" />

    <!-- Open Graph -->
    <meta data-static-seo property="og:type" content="website" />
    <meta data-static-seo property="og:site_name" content="LORSAM" />
    <meta data-static-seo property="og:locale" content="es_MX" />
    <meta data-static-seo property="og:title" content="LORSAM | HVAC/R Climatización y Refrigeración Monterrey" />
    <meta
      data-static-seo
      property="og:description"
      content="LORSAM: climatización y refrigeración industrial HVAC/R en Monterrey y Nuevo León. Sistemas VRF/TVR, chillers, cuartos fríos. +40 años, 500+ instalaciones."
    />
    <meta data-static-seo property="og:url" content="https://www.lorsam.com/" />
    <meta data-static-seo property="og:image" content="https://www.lorsam.com/og-cover.webp" />
    <meta data-static-seo property="og:image:type" content="image/webp" />
    <meta data-static-seo property="og:image:width" content="1920" />
    <meta data-static-seo property="og:image:height" content="1072" />
    <meta
      data-static-seo
      property="og:image:alt"
      content="LORSAM - Climatización y refrigeración industrial HVAC/R en Monterrey, Nuevo León"
    />

    <!-- Twitter / X -->
    <meta data-static-seo name="twitter:card" content="summary_large_image" />
    <meta data-static-seo name="twitter:title" content="LORSAM | HVAC/R Climatización y Refrigeración Monterrey" />
    <meta
      data-static-seo
      name="twitter:description"
      content="LORSAM: climatización y refrigeración industrial HVAC/R en Monterrey y Nuevo León. Sistemas VRF/TVR, chillers, cuartos fríos. +40 años, 500+ instalaciones."
    />
    <meta data-static-seo name="twitter:image" content="https://www.lorsam.com/og-cover.webp" />
    <meta
      data-static-seo
      name="twitter:image:alt"
      content="LORSAM - Climatización y refrigeración industrial HVAC/R en Monterrey, Nuevo León"
    />

    <!-- Icons, PWA and theming -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-maskable.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#123d7e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LORSAM" />
    <meta name="application-name" content="LORSAM" />
    <meta name="format-detection" content="telephone=no" />
